# Everything lives under /_reinvent_example/, the path the demo host routes to this
# component, so the same image works behind that route and on its own port locally.
server {
    listen 8080;
    # Relative redirects: behind the demo host's TLS ingress nginx doesn't know the
    # public scheme, host or port.
    absolute_redirect off;

    location = / {
        return 302 /_reinvent_example/;
    }

    location = /_reinvent_example {
        return 301 /_reinvent_example/;
    }

    location /_reinvent_example/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /_reinvent_example/index.html;
    }

    # The shared backend, as the main frontend's nginx reaches it (service "backend").
    location /_reinvent_example/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;

        # Server-sent events for the order tracker.
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}
